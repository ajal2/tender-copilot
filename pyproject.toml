[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tender-copilot"
version = "0.1.0"
description = "Reject-risk engine for Indian government tenders: read an RFP, return go/no-go, score-to-gate, and the clauses you're about to be rejected on."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aryan Jalota" }]
keywords = ["tender", "rfp", "compliance", "procurement", "risk", "govtech"]
dependencies = []   # runs on the standard library alone

[project.scripts]
tender-copilot = "tender_copilot.__main__:main"

[tool.setuptools]
packages = ["tender_copilot"]
