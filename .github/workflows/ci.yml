name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reject-risk regression (no deps)
        run: python -m unittest evals.test_audit -v
      - name: Hero output renders
        run: python -m tender_copilot
